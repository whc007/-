# 开发环境（application.properties 中 spring.profiles.active=dev 已启用）
server.port=8081

# ===================== 数据源（本地 MySQL） =====================
# createDatabaseIfNotExist=true：数据库不存在时由驱动自动创建，配合下面的 sql.init 自动建表
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== MyBatis-Plus =====================
mybatis-plus.mapper-locations=classpath*:sql/mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-underline=true
# 控制台打印 SQL，方便本地调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===================== 启动时自动执行建表 SQL =====================
# 指向 resources/sql/ 下的建表脚本（含 CREATE TABLE IF NOT EXISTS 与 INSERT IGNORE，可重复执行）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/user_schema.sql,classpath:sql/content_schema.sql
spring.sql.init.encoding=UTF-8
